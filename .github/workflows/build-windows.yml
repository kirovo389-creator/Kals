name: Build Astra Workstation 0.3.0 for Windows
on:
  push:
    branches: [main, astra-0.3.0-native]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra-windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Download verified Node.js and uv runtimes
        run: npm run download:runtimes
      - name: Verify bundled runtimes
        shell: pwsh
        run: |
          $node = & resources/node/node.exe --version
          $uv = & resources/bin/uv.exe --version
          $uvx = & resources/bin/uvx.exe --version
          Write-Host "Node: $node"
          Write-Host "uv: $uv"
          Write-Host "uvx: $uvx"
          if ($node -ne "v24.22.2") { throw "Unexpected Node version: $node" }
          if ($uv -notmatch "0\.13\.7" -or $uvx -notmatch "0\.13\.7") { throw "Unexpected uv version" }
          foreach ($file in @("resources/node/npm.cmd", "resources/node/npx.cmd", "resources/node/node_modules/npm/bin/npm-cli.js")) {
            if (-not (Test-Path $file)) { throw "Missing runtime file: $file" }
          }
      - name: Build Windows installer
        run: npm run build -- --publish never
      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Astra-Workstation-Setup-0.3.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Astra 0.3.0 installer was not created." }
          if ($installer.Length -lt 50000000) { throw "Installer looks unexpectedly small: $($installer.Length) bytes" }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Astra-Workstation-0.3.0-Windows-x64
          path: dist/Astra-Workstation-Setup-0.3.0.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/astra-0.3.0-native'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Astra-Workstation-Setup-0.3.0.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found." }
          gh release create v0.3.0 $installer.FullName --target astra-0.3.0-native --title "Astra Workstation 0.3.0" --notes "Native Windows Agent Canvas runtime. No Docker or WSL required. Includes a visible Playwright Edge browser, persistent OpenHands state migration from 0.2.0, bundled and SHA-256-verified Node.js and uv runtimes, and game-development starter skills. This local no-sandbox runtime uses the current Windows account permissions."
