name: Build Astra Workstation for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-windows-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Astra-Workstation-Windows-x64
          path: dist/Astra-Workstation-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
